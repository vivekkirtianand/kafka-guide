name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify-local-cluster-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f local-cluster-lab/docker-compose.yml config --quiet
      - run: docker compose --profile extras -f local-cluster-lab/docker-compose.yml config --quiet
      - run: jq empty local-cluster-lab/grafana/dashboards/kafka-overview.json
      - run: bash -n local-cluster-lab/verify-lab.sh
      - run: shellcheck local-cluster-lab/verify-lab.sh

  verify-order-pipeline-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/order-pipeline-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle distribution + dependencies and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
